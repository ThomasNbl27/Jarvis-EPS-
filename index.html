<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis EPS — Assistant pédagogique</title>
<meta name="description" content="Cahier de texte, suivi des élèves et base de compétences EPS. Fonctionne hors connexion, directement depuis le téléphone.">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis EPS">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<a class="skip-link" href="#view">Aller au contenu</a>

<div class="app">

  <!-- ================= EN-TÊTE ================= -->
  <header class="topbar" id="topbar">
    <div class="topbar__inner">
      <div class="topbar__id">
        <span class="topbar__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.2"/><path d="M9.6 2.6h4.8M12 2.6v2.7M17.6 7.4l1.6-1.7"/><path d="M12 13.5l3.1-3.1"/></svg>
        </span>
        <span class="topbar__titles">
          <strong id="topbar-title">Jarvis EPS</strong>
          <small id="topbar-sub">Assistant pédagogique</small>
        </span>
      </div>
      <div class="topbar__actions">
        <button class="iconbtn" id="btn-theme" type="button" aria-label="Changer de thème" title="Thème">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-moon"><path d="M20 14.4A8.4 8.4 0 019.6 4a8.4 8.4 0 1010.4 10.4z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ================= NAVIGATION LATÉRALE (bureau) ================= -->
  <nav class="sidenav" aria-label="Navigation principale">
    <div class="sidenav__brand">
      <span class="topbar__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.2"/><path d="M9.6 2.6h4.8M12 2.6v2.7M17.6 7.4l1.6-1.7"/><path d="M12 13.5l3.1-3.1"/></svg>
      </span>
      <span><strong>Jarvis EPS</strong><small>Assistant pédagogique</small></span>
    </div>
    <div class="sidenav__links" id="sidenav-links"></div>
    <div class="sidenav__foot">
      <button class="btn btn--primary btn--block" data-action="nouvelle-seance" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Nouvelle séance
      </button>
    </div>
  </nav>

  <!-- ================= CONTENU ================= -->
  <main class="view" id="view" tabindex="-1"></main>

  <!-- ================= BOUTON FLOTTANT ================= -->
  <button class="fab" id="fab" type="button" data-action="nouvelle-seance" aria-label="Nouvelle séance">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- ================= BARRE D'ONGLETS (mobile) ================= -->
  <nav class="tabbar" id="tabbar" aria-label="Navigation principale"></nav>

</div>

<!-- ================= COUCHES ================= -->
<div class="sheet-root" id="sheet-root" aria-hidden="true"></div>
<div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="false"></div>
<div class="print-root" id="print-root" aria-hidden="true"></div>

<script src="assets/js/utils.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/eps.js"></script>
<script src="assets/js/speech.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/exports.js"></script>
<script src="assets/js/pdf.js"></script>
<script src="assets/js/views/accueil.js"></script>
<script src="assets/js/views/seances.js"></script>
<script src="assets/js/views/eleves.js"></script>
<script src="assets/js/views/base.js"></script>
<script src="assets/js/views/pdf.js"></script>
<script src="assets/js/views/reglages.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
